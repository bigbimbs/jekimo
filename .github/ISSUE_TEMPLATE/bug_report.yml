name: Bug report
description: Report a problem in Jekimo
title: "[Bug]: "
labels: ["type: bug"]
body:
  - type: markdown
    attributes:
      value: Please do not include credentials, personal data, or real captured event payloads.
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the issue and what you expected to happen.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Jekimo version
    validations:
      required: false
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      render: text
    validations:
      required: false
