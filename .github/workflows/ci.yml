name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Install and type-check
    runs-on: ubuntu-latest
    services:
      # Integration tests in packages/storage-postgres and apps/api run when
      # DATABASE_URL is set; they create and drop their own schemas.
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: jekimo_test
          POSTGRES_USER: jekimo
          POSTGRES_PASSWORD: ci-only-not-a-secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U jekimo -d jekimo_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      DATABASE_URL: postgres://jekimo:ci-only-not-a-secret@localhost:5432/jekimo_test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint and format check
        run: npm run lint
      - name: Type-check
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Build and pack the Node.js SDK
        run: |
          npm run build --workspace packages/sdk-node
          npm pack --dry-run --workspace packages/sdk-node
      - name: Build apps
        run: npm run build --workspaces --if-present
