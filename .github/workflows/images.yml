# Builds and pushes the Jekimo container images to GitHub Container Registry.
#
# Images:
#   ghcr.io/bigbimbs/jekimo-api     from apps/api/Dockerfile
#   ghcr.io/bigbimbs/jekimo-worker  from apps/worker/Dockerfile
#   ghcr.io/bigbimbs/jekimo-web     from apps/web/Dockerfile (the dashboard)
#
# Tags:
#   push to main      -> edge, sha-<short sha>
#   tag vX.Y.Z        -> X.Y.Z, X.Y, and latest when it is the highest stable tag
#   tag vX.Y.Z-pre.N  -> X.Y.Z-pre.N only (pre-releases never move latest or X.Y)
#
# Each Dockerfile is built with the repository root as the build context so it
# can copy the npm workspace packages it depends on. An app without a
# Dockerfile is skipped, so this workflow stays green until the services are
# packaged. See docs/releasing.md.

name: Images

on:
  push:
    branches: [main]
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref == 'refs/heads/main' }}

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/bigbimbs/jekimo

jobs:
  image:
    name: Image (${{ matrix.app }})
    # Forks cannot push to the upstream registry namespace.
    if: github.repository == 'bigbimbs/jekimo'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        app: [api, worker, web]
    steps:
      - uses: actions/checkout@v7
        with:
          # Tags are needed to decide whether this release is the newest.
          fetch-depth: 0

      - name: Check for a Dockerfile
        id: dockerfile
        env:
          APP: ${{ matrix.app }}
        run: |
          if [ -f "apps/$APP/Dockerfile" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "::notice::apps/$APP/Dockerfile does not exist yet; skipping the jekimo-$APP image."
          fi

      # Only the highest stable version moves "latest", so a patch release of
      # an older minor (a hotfix) never replaces a newer one.
      - name: Decide whether to tag latest
        if: steps.dockerfile.outputs.exists == 'true'
        id: latest
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          newest="$(git tag --list 'v*' --sort=-v:refname | grep -v -e '-' | head -n 1 || true)"
          if [ "$REF_TYPE" = "tag" ] && [[ "$REF_NAME" != *-* ]] && [ "$REF_NAME" = "$newest" ]; then
            echo "enable=true" >> "$GITHUB_OUTPUT"
          else
            echo "enable=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up QEMU
        if: steps.dockerfile.outputs.exists == 'true'
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        if: steps.dockerfile.outputs.exists == 'true'
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        if: steps.dockerfile.outputs.exists == 'true'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tags and labels
        if: steps.dockerfile.outputs.exists == 'true'
        id: meta
        uses: docker/metadata-action@v6
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index
        with:
          images: ${{ env.IMAGE_PREFIX }}-${{ matrix.app }}
          flavor: |
            latest=false
          tags: |
            type=edge,branch=main
            type=sha,enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ steps.latest.outputs.enable }}
          labels: |
            org.opencontainers.image.title=jekimo-${{ matrix.app }}
            org.opencontainers.image.description=Jekimo ${{ matrix.app }}: self-hosted error, crash, and log observability
            org.opencontainers.image.licenses=Apache-2.0
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.url=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.documentation=${{ github.server_url }}/${{ github.repository }}/blob/main/docs/install-vps.md
          annotations: |
            org.opencontainers.image.title=jekimo-${{ matrix.app }}
            org.opencontainers.image.licenses=Apache-2.0
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

      - name: Build and push
        if: steps.dockerfile.outputs.exists == 'true'
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          build-args: |
            JEKIMO_VERSION=${{ steps.meta.outputs.version }}
            JEKIMO_REVISION=${{ github.sha }}
          cache-from: type=gha,scope=jekimo-${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=jekimo-${{ matrix.app }}
          provenance: mode=max
          sbom: true
