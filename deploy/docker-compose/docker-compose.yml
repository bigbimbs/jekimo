# Production stack for one VPS: Caddy (HTTPS), the published Jekimo API and
# worker images, a one-shot migration job, and an optional local PostgreSQL.
#
#   cp .env.example .env    # then edit it; see docs/install-vps.md
#   docker compose pull
#   docker compose up -d
#
# Only Caddy publishes ports (80 and 443). The API, the worker, and PostgreSQL
# are reachable on the Compose network only.
#
# Database:
#   - Local PostgreSQL: set COMPOSE_PROFILES=local-db and JEKIMO_DB_PASSWORD.
#   - Existing PostgreSQL: leave COMPOSE_PROFILES empty and set
#     JEKIMO_DATABASE_URL to the restricted application account.
#
# Settings: docs/configuration.md. Guide: docs/install-vps.md.

name: jekimo

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

# The services read the database through the restricted application account
# only. JEKIMO_DATABASE_URL wins when set; otherwise the URL points at the
# local-db PostgreSQL service.
x-database: &database
  JEKIMO_DATABASE_URL: ${JEKIMO_DATABASE_URL:-postgres://jekimo:${JEKIMO_DB_PASSWORD:-}@postgres:5432/jekimo}
  JEKIMO_DATABASE_POOL_MAX: ${JEKIMO_DATABASE_POOL_MAX:-10}
  JEKIMO_LOG_LEVEL: ${JEKIMO_LOG_LEVEL:-info}

x-jekimo: &jekimo
  restart: unless-stopped
  logging: *logging
  read_only: true
  tmpfs:
    - /tmp
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  depends_on:
    postgres:
      condition: service_healthy
      # Absent when the local-db profile is off and an existing database is used.
      required: false
    migrate:
      condition: service_completed_successfully

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    logging: *logging
    environment:
      JEKIMO_DOMAIN: ${JEKIMO_DOMAIN:?set JEKIMO_DOMAIN in .env, for example jekimo.example.com}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    depends_on:
      - api

  api:
    <<: *jekimo
    image: ghcr.io/bigbimbs/jekimo-api:${JEKIMO_VERSION:?set JEKIMO_VERSION in .env to a released version, for example 0.2.0}
    environment:
      <<: *database
      # Caddy is the only client; trust its X-Forwarded-For for client addresses.
      JEKIMO_TRUST_PROXY: "true"
      JEKIMO_MIGRATE_ON_START: "false"
      JEKIMO_MEMBERS_CAN_CREATE_PROJECTS: ${JEKIMO_MEMBERS_CAN_CREATE_PROJECTS:-true}
      JEKIMO_SESSION_IDLE_DAYS: ${JEKIMO_SESSION_IDLE_DAYS:-14}
      JEKIMO_SESSION_MAX_DAYS: ${JEKIMO_SESSION_MAX_DAYS:-30}
      JEKIMO_RETENTION_DEFAULT_DAYS: ${JEKIMO_RETENTION_DEFAULT_DAYS:-30}
      JEKIMO_RETENTION_MAX_DAYS: ${JEKIMO_RETENTION_MAX_DAYS:-3650}
      JEKIMO_QUEUE_MAX_ATTEMPTS: ${JEKIMO_QUEUE_MAX_ATTEMPTS:-5}
      JEKIMO_QUEUE_MAX_DEPTH: ${JEKIMO_QUEUE_MAX_DEPTH:-10000}
    expose:
      - "8080"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:8080/readyz').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"
      interval: 10s
      timeout: 3s
      start_period: 15s
      retries: 3

  worker:
    <<: *jekimo
    image: ghcr.io/bigbimbs/jekimo-worker:${JEKIMO_VERSION:?set JEKIMO_VERSION in .env to a released version, for example 0.2.0}
    environment:
      <<: *database
      JEKIMO_MIGRATE_ON_START: "false"
      JEKIMO_QUEUE_VISIBILITY_SECONDS: ${JEKIMO_QUEUE_VISIBILITY_SECONDS:-60}
      JEKIMO_WORKER_BATCH_SIZE: ${JEKIMO_WORKER_BATCH_SIZE:-10}
      JEKIMO_WORKER_POLL_MS: ${JEKIMO_WORKER_POLL_MS:-1000}
      JEKIMO_EXPIRY_INTERVAL_MINUTES: ${JEKIMO_EXPIRY_INTERVAL_MINUTES:-15}
    # The worker has no HTTP endpoint yet, so it has no /readyz health check.
    # It exits on a fatal error and is restarted by the policy above.
  # Applies pending migrations and creates the coming week's event partitions,
  # then exits. The API and the worker start only after it succeeds.
  migrate:
    image: ghcr.io/bigbimbs/jekimo-api:${JEKIMO_VERSION:?set JEKIMO_VERSION in .env to a released version, for example 0.2.0}
    command: ["node", "dist/migrate.mjs"]
    restart: "no"
    logging: *logging
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      <<: *database
    depends_on:
      postgres:
        condition: service_healthy
        required: false

  # Dashboard: planned, waits for the dashboard work (apps/web, issue #31).
  # When ghcr.io/bigbimbs/jekimo-web is published it is added here and routed
  # by the Caddyfile; until then the API serves only its JSON API.
  # web:
  #   <<: *jekimo
  #   image: ghcr.io/bigbimbs/jekimo-web:${JEKIMO_VERSION}
  #   expose:
  #     - "8080"

  # Local PostgreSQL, enabled with COMPOSE_PROFILES=local-db. On the first start
  # (empty volume) postgres-init/ creates the restricted `jekimo` account and
  # database and removes the superuser's password, so POSTGRES_ADMIN_PASSWORD
  # is used once and can be deleted from .env afterwards.
  postgres:
    image: postgres:16-alpine
    profiles: ["local-db"]
    restart: unless-stopped
    logging: *logging
    shm_size: 256mb
    stop_grace_period: 60s
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:-}
      JEKIMO_DB_PASSWORD: ${JEKIMO_DB_PASSWORD:-}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jekimo -d jekimo"]
      interval: 5s
      timeout: 3s
      start_period: 30s
      retries: 10

volumes:
  caddy-data:
  caddy-config:
  postgres-data:
