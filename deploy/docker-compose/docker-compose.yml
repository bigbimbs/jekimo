# Production stack for one VPS. Guide: docs/install-vps.md. Settings: docs/configuration.md.
# Only Caddy publishes ports; Docker's port rules bypass the host firewall, so
# the API and PostgreSQL stay on the Compose network.

name: jekimo

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

# Services get the restricted account only, never the superuser password,
# which is why no service uses env_file.
x-database: &database
  JEKIMO_DATABASE_URL: ${JEKIMO_DATABASE_URL:-postgres://jekimo:${JEKIMO_DB_PASSWORD:-}@postgres:5432/jekimo}
  JEKIMO_DATABASE_POOL_MAX: ${JEKIMO_DATABASE_POOL_MAX:-10}
  JEKIMO_LOG_LEVEL: ${JEKIMO_LOG_LEVEL:-info}

# The containers' root filesystem and the postgres-data volume both live under
# /var/lib/docker, so the default JEKIMO_DISK_PATH of / measures the database
# disk without mounting database files into the API and worker.
x-disk: &disk
  JEKIMO_DISK_WARN_PERCENT: ${JEKIMO_DISK_WARN_PERCENT:-20}
  JEKIMO_DISK_CRITICAL_PERCENT: ${JEKIMO_DISK_CRITICAL_PERCENT:-10}
  JEKIMO_DISK_FULL_PERCENT: ${JEKIMO_DISK_FULL_PERCENT:-5}
  JEKIMO_DISK_PATH: ${JEKIMO_DISK_PATH:-/}
  JEKIMO_DISK_BUDGET_BYTES: ${JEKIMO_DISK_BUDGET_BYTES:-}

x-jekimo: &jekimo
  restart: unless-stopped
  logging: *logging
  read_only: true
  tmpfs:
    - /tmp
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  depends_on:
    postgres:
      condition: service_healthy
      required: false
    migrate:
      condition: service_completed_successfully

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    logging: *logging
    environment:
      JEKIMO_DOMAIN: ${JEKIMO_DOMAIN:?set JEKIMO_DOMAIN in .env, for example jekimo.example.com}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    depends_on:
      - api
      - web

  api:
    <<: *jekimo
    image: ghcr.io/bigbimbs/jekimo-api:${JEKIMO_VERSION:?set JEKIMO_VERSION in .env to a released version, for example 0.2.0}
    environment:
      <<: [*database, *disk]
      # Caddy is the API's only client.
      JEKIMO_TRUST_PROXY: "true"
      JEKIMO_MIGRATE_ON_START: "false"
      JEKIMO_MEMBERS_CAN_CREATE_PROJECTS: ${JEKIMO_MEMBERS_CAN_CREATE_PROJECTS:-true}
      JEKIMO_SESSION_IDLE_DAYS: ${JEKIMO_SESSION_IDLE_DAYS:-14}
      JEKIMO_SESSION_MAX_DAYS: ${JEKIMO_SESSION_MAX_DAYS:-30}
      JEKIMO_INVITE_EXPIRY_DAYS: ${JEKIMO_INVITE_EXPIRY_DAYS:-7}
      JEKIMO_PUBLIC_URL: ${JEKIMO_PUBLIC_URL:-https://${JEKIMO_DOMAIN}}
      JEKIMO_KEY_ROTATION_GRACE_HOURS: ${JEKIMO_KEY_ROTATION_GRACE_HOURS:-24}
      JEKIMO_RETENTION_DEFAULT_DAYS: ${JEKIMO_RETENTION_DEFAULT_DAYS:-30}
      JEKIMO_RETENTION_MAX_DAYS: ${JEKIMO_RETENTION_MAX_DAYS:-3650}
      JEKIMO_QUEUE_MAX_ATTEMPTS: ${JEKIMO_QUEUE_MAX_ATTEMPTS:-5}
      JEKIMO_QUEUE_MAX_DEPTH: ${JEKIMO_QUEUE_MAX_DEPTH:-10000}
      JEKIMO_RATE_LIMIT_PER_MINUTE: ${JEKIMO_RATE_LIMIT_PER_MINUTE:-1000}
      JEKIMO_QUOTA_EVENTS_PER_DAY: ${JEKIMO_QUOTA_EVENTS_PER_DAY:-}
    expose:
      - "8080"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:8080/readyz').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"
      interval: 10s
      timeout: 3s
      start_period: 15s
      retries: 3

  worker:
    <<: *jekimo
    image: ghcr.io/bigbimbs/jekimo-worker:${JEKIMO_VERSION:?set JEKIMO_VERSION in .env to a released version, for example 0.2.0}
    environment:
      <<: [*database, *disk]
      JEKIMO_MIGRATE_ON_START: "false"
      JEKIMO_RETENTION_DEFAULT_DAYS: ${JEKIMO_RETENTION_DEFAULT_DAYS:-30}
      JEKIMO_RETENTION_MAX_DAYS: ${JEKIMO_RETENTION_MAX_DAYS:-3650}
      JEKIMO_QUEUE_VISIBILITY_SECONDS: ${JEKIMO_QUEUE_VISIBILITY_SECONDS:-60}
      JEKIMO_WORKER_BATCH_SIZE: ${JEKIMO_WORKER_BATCH_SIZE:-10}
      JEKIMO_WORKER_POLL_MS: ${JEKIMO_WORKER_POLL_MS:-1000}
      JEKIMO_EXPIRY_INTERVAL_MINUTES: ${JEKIMO_EXPIRY_INTERVAL_MINUTES:-15}
      JEKIMO_AUDIT_LOG_DAYS: ${JEKIMO_AUDIT_LOG_DAYS:-365}
    # No HTTP endpoint yet, so no /readyz health check; it exits on fatal errors.
  migrate:
    image: ghcr.io/bigbimbs/jekimo-api:${JEKIMO_VERSION:?set JEKIMO_VERSION in .env to a released version, for example 0.2.0}
    command: ["node", "dist/migrate.mjs"]
    restart: "no"
    logging: *logging
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      <<: *database
    depends_on:
      postgres:
        condition: service_healthy
        required: false

  # The dashboard: static files served by Caddy as a non-root user. It needs
  # no database or secrets; it calls the API through the front Caddy.
  web:
    image: ghcr.io/bigbimbs/jekimo-web:${JEKIMO_VERSION:?set JEKIMO_VERSION in .env to a released version, for example 0.2.0}
    restart: unless-stopped
    logging: *logging
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    expose:
      - "8080"

  # POSTGRES_ADMIN_PASSWORD is used only to initialise an empty volume;
  # postgres-init/ then removes the superuser's password (docs/database-setup.md).
  postgres:
    image: postgres:16-alpine
    profiles: ["local-db"]
    restart: unless-stopped
    logging: *logging
    shm_size: 256mb
    stop_grace_period: 60s
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:-}
      JEKIMO_DB_PASSWORD: ${JEKIMO_DB_PASSWORD:-}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jekimo -d jekimo"]
      interval: 5s
      timeout: 3s
      start_period: 30s
      retries: 10

volumes:
  caddy-data:
  caddy-config:
  postgres-data:
